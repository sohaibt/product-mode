<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Test referral demand before building the system</title>
<desc id="desc">Illustrative scenario. A large referral feature request becomes an opt-in pilot that measures introductions and activation. Not a model transcript or measured result.</desc>
<rect width="1200" height="1500" fill="#F5F2EA"/>
<text x="64" y="67" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#162C33">PRODUCT-MODE / WORKED EXAMPLE</text>
<text x="64" y="148" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#162C33">Test referral demand</text>
<text x="64" y="220" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#162C33">before building the system.</text>
<text x="64" y="274" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="#526267">An illustrative product-framing walkthrough</text>
<rect x="64" y="320" width="1072" height="230" rx="12" fill="white" stroke="#D7DDD8"/>
<text x="92" y="368" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#BB4C2A">01</text>
<text x="145" y="368" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#162C33">THE REQUEST</text>
<text x="92" y="420" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Invite codes. Credits. Leaderboards.</text>
<text x="92" y="462" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Fraud detection. An admin dashboard.</text>
<text x="92" y="504" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">A feature list with several untested assumptions.</text>
<rect x="64" y="575" width="1072" height="230" rx="12" fill="white" stroke="#D7DDD8"/>
<text x="92" y="623" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#BB4C2A">02</text>
<text x="145" y="623" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#162C33">THE QUESTION</text>
<text x="92" y="675" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Will existing customers introduce another team?</text>
<text x="92" y="717" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">What evidence supports rewards?</text>
<text x="92" y="759" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Keep the unknowns visible before coding.</text>
<rect x="64" y="830" width="1072" height="230" rx="12" fill="white" stroke="#D7DDD8"/>
<text x="92" y="878" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#BB4C2A">03</text>
<text x="145" y="878" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#162C33">THE FIRST TEST</text>
<text x="92" y="930" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Run a small, opt-in referral pilot.</text>
<text x="92" y="972" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Record introductions and referred-team activation.</text>
<text x="92" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#162C33">Revisit automation when manual work becomes costly.</text>
<rect x="64" y="1090" width="1072" height="210" rx="12" fill="#162C33"/>
<text x="92" y="1136" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#F7C088">DEFINE SUCCESS BEFORE THE PILOT</text>
<text x="92" y="1185" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="400" fill="white">Share of pilot participants whose referrals activate.</text>
<text x="92" y="1233" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="400" fill="white">Agree on activation, the baseline, and the review date.</text>
<text x="92" y="1271" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#CBD9D8">Tradeoff: less infrastructure, more manual handling.</text>
<text x="64" y="1360" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#162C33">Free product guidelines for AI coding agents</text>
<text x="64" y="1405" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#BB4C2A">github.com/sohaibt/product-mode</text>
<text x="64" y="1460" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#526267">Authored example. Not a model transcript or measured outcome.</text>
</svg>
